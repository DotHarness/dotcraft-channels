name: Release channels

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Plugin id to submit, such as channel-feishu, or all for a coordinated release.
        required: true
        type: string
        default: all
      marketplace:
        description: Submit the selected plugins to the official marketplace.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  prepare:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.select.outputs.plugins }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Select plugins
        id: select
        env:
          SELECTED: ${{ inputs.channel }}
          TAG: ${{ github.ref_name }}
        run: node scripts/select-release-plugins.mjs >> "$GITHUB_OUTPUT"
      - name: Package the offline seed archive
        run: |
          tar -czf out/channel-seeds.tar.gz -C out/plugins $(ls out/plugins)
          (cd out && sha256sum channel-seeds.tar.gz > channel-seeds.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: channel-plugins
          path: out/plugins
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: channel-seeds
          path: |
            out/channel-seeds.tar.gz
            out/channel-seeds.sha256
          if-no-files-found: error

  publish-seeds:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: channel-seeds
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes channel-seeds.tar.gz channel-seeds.sha256

  marketplace:
    if: inputs.marketplace
    needs: [prepare, publish-seeds]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: channel-plugins
          path: plugins
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.MARKETPLACE_APP_ID }}
          private-key: ${{ secrets.MARKETPLACE_APP_PRIVATE_KEY }}
          owner: DotHarness
          repositories: dotcraft-plugins
      - uses: actions/checkout@v6
        with:
          repository: DotHarness/dotcraft-plugins
          token: ${{ steps.app.outputs.token }}
          path: marketplace
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stage selected plugins
        id: stage
        env:
          TAG: ${{ github.ref_name }}
          SELECTED: ${{ inputs.channel }}
          PLUGINS_JSON: ${{ needs.prepare.outputs.plugins }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$SELECTED" = "all" ]; then
            echo "target=channels" >> "$GITHUB_OUTPUT"
            echo "title=Update channel plugins to $version" >> "$GITHUB_OUTPUT"
          else
            echo "target=$SELECTED" >> "$GITHUB_OUTPUT"
            echo "title=Update $SELECTED to $version" >> "$GITHUB_OUTPUT"
          fi
          for id in $(node -e 'console.log(JSON.parse(process.env.PLUGINS_JSON).join("\n"))'); do
            GITHUB_OUTPUT= node marketplace/scripts/stage-plugin.mjs --source "plugins/$id" --category Channels \
              --version "$version" --repository "$REPOSITORY" --commit "$COMMIT"
          done
          node marketplace/scripts/validate-registry.mjs
      - uses: peter-evans/create-pull-request@v7
        with:
          path: marketplace
          token: ${{ steps.app.outputs.token }}
          branch: updates/${{ steps.stage.outputs.target }}-${{ steps.stage.outputs.version }}
          commit-message: ${{ steps.stage.outputs.title }}
          title: ${{ steps.stage.outputs.title }}
          body: Plugin files and release provenance from ${{ github.repository }}@${{ github.sha }}. Maintainer review and merge are required.
          add-paths: |
            plugins/**
            .craft/plugins/marketplace.json
